<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>レビューの投稿</title>
</head>
<body>
    <h1>「{{ course['title'] }}」のレビューを投稿</h1>
    <form method="post">
        <p>学籍番号: 
            <input type="text" name="name" 
                   pattern="\d{9}" 
                   maxlength="9" 
                   placeholder="例：123456789" 
                   title="9桁の数字で入力してください" 
                   required>
        </p>
        <p>難易度 (1-5): <input type="number" name="difficulty" min="1" max="5" required></p>
        <p>おすすめ度 (1-5): <input type="number" name="recommend" min="1" max="5" required></p>
        <p>出席確認: <input type="checkbox" name="attendance"></p>
        <p>評価方法: <input type="text" name="assessment" placeholder="例：レポートのみ"></p>
        <p>コメント:<br><textarea name="comment" rows="4" cols="40"></textarea></p>
        <button type="submit">投稿する</button>
    </form>
    <p><a href="{{ url_for('index') }}">戻る</a></p>
</body>
</html>
